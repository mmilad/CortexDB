[project]
name = "cortexdb"
version = "0.3.0"
description = "LLM-native memory and retrieval layer for agentic systems"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0"
]
# Storage: Python stdlib sqlite3. No extra DB dependencies.
# Embedding: httpx calls to Ollama (default) or any OpenAI-compatible API.
# Future vector index: sqlite-vec extension (optional, auto-detected when installed).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
