[project]
name = "cortexdb"
version = "0.4.0"
description = "LLM-native memory and retrieval layer for agentic systems"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0"
]
# Storage: Python stdlib sqlite3 + optional sqlite-vec for ANN vector search.
# Embedding: httpx calls to Ollama (default) or any OpenAI-compatible API.

[project.scripts]
# Local MCP stdio server — use with Claude Desktop, Cursor, Continue, etc.
# Example claude_desktop_config.json entry:
#   { "command": "cortexdb-mcp", "args": [] }
cortexdb-mcp = "app.mcp.stdio:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# Install sqlite-vec for ANN vector search (recommended; ~20x faster at 20k rows).
vec = [
  "sqlite-vec>=0.1.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "httpx>=0.27.0",
  "sqlite-vec>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
